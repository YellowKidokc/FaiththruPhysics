<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="30">
  <title>Site Master Loop Screenshots</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #050505; color: #e7e2d3; font-family: Inter, Arial, sans-serif; }
    .bar { position: sticky; top: 0; z-index: 2; padding: 10px 14px; background: rgba(5,5,5,.92); border-bottom: 1px solid rgba(212,175,55,.25); }
    .meta { font-size: 12px; color: #d4af37; letter-spacing: .04em; text-transform: uppercase; }
    .stage { font-size: 14px; color: #bdb8aa; margin-top: 4px; }
    .deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 14px; }
    .slide { width: 100%; height: auto; border: 1px solid rgba(212,175,55,.18); border-radius: 10px; background: #111; }
  
/* ═══ TP-HEADING-CLEANUP-v1 ═══ */

/* H1: big, white, serif — page anchor */
.tp-article h1, .ftp-article h1 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 2.8rem;
  font-weight: 400;
  color: #fff;
  margin-bottom: .8rem;
  margin-top: 2rem;
  line-height: 1.1;
  letter-spacing: -.01em;
}

/* H2: GOLD — section markers */
.tp-article h2, .ftp-article h2 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 1.6rem;
  color: #d4af37;
  font-weight: 400;
  margin: 3rem 0 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(212, 175, 55, 0.2);
  letter-spacing: -.01em;
}

/* H3: clean subordinate */
.tp-article h3, .ftp-article h3 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 1.2rem;
  color: #9a9a9a;
  font-weight: 600;
  margin: 2rem 0 .6rem;
}

/* Tables: gold header, dark rows, hover */
.tp-article table, .ftp-article table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: .9rem;
}
.tp-article th, .ftp-article th {
  background: rgba(212, 175, 55, 0.08);
  color: #d4af37;
  font-weight: 600;
  text-align: left;
  padding: .6rem .8rem;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  font-size: .8rem;
  letter-spacing: .03em;
}
.tp-article td, .ftp-article td {
  padding: .5rem .8rem;
  border-bottom: 1px solid #222;
  color: #e5e3df;
}
.tp-article tr:hover td, .ftp-article tr:hover td {
  background: rgba(212, 175, 55, 0.03);
}

/* Lists: proper spacing */
.tp-article ul, .tp-article ol,
.ftp-article ul, .ftp-article ol {
  margin: 1rem 0 1rem 1.5rem;
  line-height: 1.8;
}
.tp-article li, .ftp-article li {
  margin-bottom: .3rem;
}

/* Blockquotes: gold accent */
.tp-article blockquote, .ftp-article blockquote {
  border-left: 3px solid #d4af37;
  margin: 1.5rem 0;
  padding: .8rem 1.2rem;
  background: rgba(212, 175, 55, 0.04);
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-style: italic;
  color: #9a9a9a;
}

/* Drop cap on first paragraph */
.tp-article > p:first-of-type::first-letter,
.ftp-article > p:first-of-type::first-letter,
.tp-level-panel > p:first-of-type::first-letter {
  font-size: 3.2rem;
  float: left;
  color: #d4af37;
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-weight: 600;
  line-height: .8;
  margin: .1rem .4rem 0 0;
  padding-top: .1rem;
}

/* Code/mono blocks */
.tp-article pre, .tp-article code,
.ftp-article pre, .ftp-article code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: .85rem;
}
.tp-article pre, .ftp-article pre {
  background: #0a0a0a;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 1rem 1.2rem;
  overflow-x: auto;
  margin: 1.5rem 0;
}

/* ═══ END TP-HEADING-CLEANUP-v1 ═══ */
</style>
</head>
<body>
  <div class="bar">
    <div class="meta">POF 2828 - Site Master Loop Gallery</div>
    <div class="stage">1 screenshot(s) - auto-refresh every 30s</div>
  </div>
  <div class="deck">
    <img class="slide" src="headers/cns-07-the-verdict.png" alt="headers/cns-07-the-verdict.png" loading="lazy">
  </div>
</body>
</html>
