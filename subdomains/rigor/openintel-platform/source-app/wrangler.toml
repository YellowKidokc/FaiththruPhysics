name = "openintel-api"
main = "api/boot.ts"
compatibility_date = "2026-06-04"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "openintel-db"
database_id = "29238b3c-9c05-4cfd-849a-355d3f9c2b27"

[vars]
# These are public-ish defaults; override secrets via:
#   wrangler secret put APP_ID
#   wrangler secret put APP_SECRET
#   wrangler secret put KIMI_AUTH_URL
#   wrangler secret put KIMI_OPEN_URL
# OWNER_UNION_ID can be set as a plain var or secret.
