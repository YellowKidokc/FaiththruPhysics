<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theophysics Proof Bundle Viewer</title>
  <style>
    :root {
      --bg: #0a0b0f;
      --panel: #12141c;
      --border: #1e2233;
      --text: #e8e6e1;
      --muted: #8a8d9b;
      --gold: #d4a853;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }
    .title {
      margin: 0 0 6px 0;
      color: var(--gold);
      font-size: 18px;
    }
    .sub {
      margin: 0 0 16px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .group {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .group h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .link {
      display: block;
      width: 100%;
      margin: 6px 0;
      text-align: left;
      background: #0e1018;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .link:hover { border-color: var(--gold); }
    .viewer {
      background: #0b0d12;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      color: var(--muted);
      font-size: 12px;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      background: white;
    }
    code { color: var(--gold); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1 class="title">Proof Bundle Viewer</h1>
    <p class="sub">Open one file and preview all pages. If a page fails, click its button again or open directly.</p>

    <div class="group">
      <h3>Main</h3>
      <button class="link" data-file="index.html">Overview Index</button>
      <button class="link" data-file="theophysics_proof_explorer_v2.html">Proof Explorer v2</button>
      <button class="link" data-file="theophysics_proof_explorer_v2_1.html">Proof Explorer v2.1</button>
      <button class="link" data-file="structural-isomorphism.html">Structural Isomorphism</button>
    </div>

    <div class="group">
      <h3>6-Page Proof</h3>
      <button class="link" data-file="foundation.html">Foundation</button>
      <button class="link" data-file="subsystems.html">Subsystems</button>
      <button class="link" data-file="bifurcation.html">Bifurcation</button>
      <button class="link" data-file="evidence.html">Evidence</button>
      <button class="link" data-file="falsification.html">Falsification</button>
      <button class="link" data-file="closure.html">Closure</button>
    </div>

    <div class="group">
      <h3>Logic Tools</h3>
      <button class="link" data-file="ontological_tree.html">Ontological Tree</button>
      <button class="link" data-file="propagation_map.html">Propagation Map</button>
      <button class="link" data-file="theophysics_logical_framework_v1.html">Logical Framework v1</button>
    </div>
  </aside>

  <main class="viewer">
    <div class="topbar">Current: <code id="current">index.html</code></div>
    <iframe id="frame" src="index.html" title="Bundle Preview"></iframe>
  </main>

  <script>
    const frame = document.getElementById("frame");
    const current = document.getElementById("current");
    document.querySelectorAll(".link").forEach((btn) => {
      btn.addEventListener("click", () => {
        const file = btn.getAttribute("data-file");
        frame.src = file;
        current.textContent = file;
      });
    });
  </script>
</body>
</html>
