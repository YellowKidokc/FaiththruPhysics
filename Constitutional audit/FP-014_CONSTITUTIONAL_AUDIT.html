function renderChart(){const area=document.getElementById('chartArea');const cd=CHARTS[currentSheet];if(!cd){area.innerHTML='';return;}const maxVal=Math.max(...cd.values.map(v=>Math.abs(v)),1);const barHeight=100;let barsHtml='';cd.values.forEach((v,i)=>{const h=Math.max(Math.abs(v)/maxVal*barHeight,2);const cls=v>=0?'positive':'negative';const lbl=cd.labels[i]||'';const formatted=typeof v==='number'?v.toLocaleString():v;barsHtml+=`<div class="chart-bar-wrap"><div class="chart-bar-value">${formatted}</div><div class="chart-bar ${cls}" style="height:${h}px;width:24px;" title="${lbl}: ${formatted}"></div><div class="chart-bar-label">${lbl}</div></div>`;});area.innerHTML=`<div class="chart-container"><div class="chart-title">▎ ${cd.col_name}</div><div class="chart-bars">${barsHtml}</div></div>`;}
function getColStats(sheet){const stats={};if(sheet.rows.length<2)return stats;for(let ci=0;ci<sheet.col_count;ci++){const nums=[];for(let ri=1;ri<sheet.rows.length;ri++){const cell=sheet.rows[ri]?.[ci];if(cell&&typeof cell.v==='number')nums.push(cell.v);}if(nums.length>=2){const mn=Math.min(...nums);const mx=Math.max(...nums);if(mx!==mn)stats[ci]={min:mn,max:mx};}}return stats;}
function renderTable(){const sheet=SHEETS[currentSheet];if(!sheet||!sheet.rows.length){document.getElementById('tableHead').innerHTML='';document.getElementById('tableBody').innerHTML='<tr><td class="empty-state" colspan="99">No data</td></tr>';document.getElementById('rowCount').textContent='';return;}const stats=getColStats(sheet);const headerRow=sheet.rows[0];const dataRows=sheet.rows.slice(1);const search=searchTerm.toLowerCase();let headHtml='<tr>';headerRow.forEach(cell=>{const val=cell.v!==null&&cell.v!==undefined?String(cell.v):'';headHtml+=`<th>${escHtml(val)}</th>`;});headHtml+='</tr>';document.getElementById('tableHead').innerHTML=headHtml;let bodyHtml='';let visibleCount=0;dataRows.forEach(row=>{if(search){const match=row.some(cell=>String(cell.v).toLowerCase().includes(search));if(!match)return;}visibleCount++;bodyHtml+='<tr>';row.forEach((cell,ci)=>{const val=cell.v!==null&&cell.v!==undefined?cell.v:'';const isNum=typeof val==='number';const displayVal=isNum?val.toLocaleString():String(val);let style='';if(cell.bg)style+=`background:${cell.bg};`;if(cell.fg)style+=`color:${cell.fg};`;if(cell.b)style+='font-weight:700;';let barHtml='';if(isNum&&stats[ci]){const range=stats[ci].max-stats[ci].min;const pct=((val-stats[ci].min)/range*100).toFixed(1);const cls=val>=0?(val>stats[ci].max*0.7?'positive':'neutral'):'negative';barHtml=`<div class="data-bar ${cls}" style="width:${pct}%"></div>`;}let sevClass='';if(!isNum){const lower=String(val).toLowerCase();if(/critical|severe|extreme|crisis/.test(lower))sevClass='severity-high';else if(/warning|caution|moderate|concern/.test(lower))sevClass='severity-med';else if(/stable|normal|low|minimal/.test(lower))sevClass='severity-low';else if(/note|info|reference/.test(lower))sevClass='severity-info';}const numClass=isNum?' num':'';const barCellClass=barHtml?' data-bar-cell':'';bodyHtml+=`<td class="${numClass}${barCellClass}${sevClass}" style="${style}">`;bodyHtml+=barHtml;bodyHtml+=`<span class="cell-value">${escHtml(displayVal)}</span>`;bodyHtml+='</td>';});bodyHtml+='</tr>';});document.getElementById('tableBody').innerHTML=bodyHtml||'<tr><td class="empty-state" colspan="99">No matching rows</td></tr>';document.getElementById('rowCount').textContent=`${visibleCount} of ${dataRows.length} rows`;document.getElementById('meta').textContent=`${sheet.name} · ${sheet.col_count} cols · ${sheet.rows.length} rows`;}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(){renderTabs();renderChart();renderTable();}
document.getElementById('searchBox').addEventListener('input',(e)=>{searchTerm=e.target.value;renderTable();});
const tooltip=document.getElementById('tooltip');document.getElementById('tableBody').addEventListener('mouseover',(e)=>{const td=e.target.closest('td');if(td&&td.scrollWidth>td.clientWidth+10){tooltip.textContent=td.textContent;tooltip.style.display='block';}});document.addEventListener('mousemove',(e)=>{if(tooltip.style.display==='block'){tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY+12)+'px';}});document.getElementById('tableBody').addEventListener('mouseout',()=>{tooltip.style.display='none';});
render();
</script>
