<style>
/* ═══ RESTORED ORIGINAL PAGE CSS (restore_styles.py, from git daa093a9) ═══ */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
:root {--bg-deepest:#0a0a0a;--bg-deep:#111111;--bg-surface:#1a1a18;--bg-elevated:#222220;--bg-hover:#2a2a26;--border:#333330;--border-light:#444440;--text-primary:#d4c9a8;--text-secondary:#9a9080;--text-muted:#6a6458;--accent-warm:#c49a5c;--accent-gold:#d4a44a;--accent-ember:#b85c3a;--accent-teal:#5a9a8a;--bar-positive:#5a9a5a;--bar-negative:#9a4a3a;--bar-neutral:#5a7a9a;--header-bg:#1a1816;--tab-active:#c49a5c;--tab-inactive:#6a6458;--scrollbar-thumb:#444440;--scrollbar-track:#1a1a18;}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg-deepest);color:var(--text-primary);font-family:'JetBrains Mono','Consolas',monospace;font-size:13px;line-height:1.4;}
body{min-height:100vh;background:var(--bg-deepest);}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:var(--scrollbar-track);}::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:4px;}
.viewer-header{position:sticky;top:0;z-index:100;background:var(--bg-deep);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(12px);}
.viewer-title{font-family:'Libre Baskerville',Georgia,serif;font-size:18px;color:var(--accent-warm);letter-spacing:0.5px;}
.viewer-meta{font-size:11px;color:var(--text-muted);}
.tab-bar{position:sticky;top:49px;z-index:99;background:var(--bg-deep);display:flex;gap:0;border-bottom:2px solid var(--border);padding:0 16px;overflow-x:auto;}
.tab{padding:10px 20px;cursor:pointer;color:var(--tab-inactive);font-size:12px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s ease;white-space:nowrap;user-select:none;}
.tab:hover{color:var(--text-primary);background:var(--bg-hover);}
.tab.active{color:var(--tab-active);border-bottom-color:var(--tab-active);}
.chart-container{padding:20px 24px;background:var(--bg-deep);border-bottom:1px solid var(--border);}
.chart-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:12px;}
.chart-bars{display:flex;align-items:flex-end;gap:2px;height:120px;padding:0 4px;overflow-x:auto;}
.chart-bar-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:18px;}
.chart-bar{width:100%;min-width:14px;max-width:36px;border-radius:2px 2px 0 0;transition:opacity 0.2s;position:relative;}
.chart-bar:hover{opacity:0.8;}
.chart-bar-label{font-size:8px;color:var(--text-muted);writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);max-height:60px;overflow:hidden;margin-top:4px;}
.chart-bar-value{font-size:8px;color:var(--text-secondary);margin-bottom:2px;}
.table-wrapper{overflow:auto;max-height:calc(100vh - 200px);position:relative;}
table{border-collapse:collapse;width:max-content;min-width:100%;}
thead{position:sticky;top:0;z-index:10;}
thead th{background:var(--header-bg);color:var(--accent-warm);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;padding:10px 14px;border:1px solid var(--border);white-space:nowrap;text-align:left;position:sticky;top:0;}
tbody td{padding:7px 14px;border:1px solid var(--border);vertical-align:top;position:relative;transition:background 0.15s;}
tbody tr:hover td{background:var(--bg-hover) !important;}
tbody tr:nth-child(even) td{background:var(--bg-surface);}
tbody tr:nth-child(odd) td{background:var(--bg-elevated);}
.data-bar-cell{position:relative;}
.data-bar{position:absolute;left:0;top:0;bottom:0;opacity:0.15;border-radius:0 2px 2px 0;pointer-events:none;transition:width 0.3s ease;}
.data-bar.positive{background:var(--bar-positive);}.data-bar.negative{background:var(--bar-negative);}.data-bar.neutral{background:var(--bar-neutral);}
.cell-value{position:relative;z-index:1;}
.severity-high{color:#e06050;}.severity-med{color:#d4a44a;}.severity-low{color:#6aaa6a;}.severity-info{color:#6a9aba;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
.empty-state{padding:60px 24px;text-align:center;color:var(--text-muted);font-style:italic;}
.viewer-footer{padding:16px 24px;text-align:center;font-size:10px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--bg-deep);}
.toolbar{display:flex;gap:12px;align-items:center;padding:8px 24px;background:var(--bg-deep);border-bottom:1px solid var(--border);}
.search-box{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);padding:6px 12px;border-radius:4px;font-family:inherit;font-size:12px;width:260px;outline:none;}
.search-box:focus{border-color:var(--accent-warm);}
.row-count{font-size:11px;color:var(--text-muted);margin-left:auto;}
.tooltip{display:none;position:fixed;background:var(--bg-elevated);border:1px solid var(--accent-warm);padding:6px 10px;border-radius:4px;font-size:11px;color:var(--text-primary);z-index:1000;pointer-events:none;max-width:300px;word-wrap:break-word;}

/* ═══════════════ SITE NAVIGATION BAR ═══════════════ */
.site-nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 9999;
  background: rgba(8, 8, 12, 0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid #1a1a2a;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
.site-nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: stretch;
  min-height: 52px;
}
.site-nav-prev, .site-nav-next {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.6rem 1rem;
  color: #888; text-decoration: none;
  font-size: 0.78rem; transition: all 0.2s;
  white-space: nowrap; min-width: 0;
}
.site-nav-prev:hover, .site-nav-next:hover {
  color: #d4af37; background: rgba(212,175,55,0.06);
}
.site-nav-prev i, .site-nav-next i { font-size: 0.65rem; flex-shrink: 0; }
.site-nav-prev .snl, .site-nav-next .snl {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;
}
.site-nav-center {
  flex: 1; display: flex; align-items: center;
  justify-content: center; gap: 0.15rem;
}
.site-nav-center a {
  display: flex; align-items: center; gap: 0.35rem;
  padding: 0.5rem 0.8rem; color: #666;
  text-decoration: none; font-size: 0.65rem;
  letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: 500; transition: all 0.2s; border-radius: 4px;
}
.site-nav-center a:hover { color: #d4af37; background: rgba(212,175,55,0.08); }
.site-nav-center a.sn-home { color: #d4af37; }
.site-nav-center a.sn-home:hover { color: #fff; }
.site-nav-center a i { font-size: 0.6rem; }
.site-nav-center .sns { width: 1px; height: 18px; background: #1a1a2a; }
.site-nav-disabled { opacity: 0.25; pointer-events: none; }
body { padding-bottom: 60px !important; }
@media (max-width: 640px) {
  .site-nav-prev .snl, .site-nav-next .snl { display: none; }
  .site-nav-center a span { display: none; }
  .site-nav-center a { padding: 0.5rem 0.6rem; }
  .site-nav-center .sns { height: 14px; }
}
</style>
<style>
/* ═══ TP-WORKER-AUDIO-PLAYER ═══ */
.tp-player-block{max-width:720px;margin:0 auto 1.5rem;}
.tp-read-aloud{display:flex;align-items:center;gap:.65rem;padding:.65rem .9rem;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.15);border-radius:.5rem;margin-bottom:.65rem;}
.tp-read-aloud .tp-dot{width:7px;height:7px;border-radius:50%;background:var(--highlight,#d4af37);box-shadow:0 0 6px rgba(212,175,55,.4);flex-shrink:0;}
.tp-read-aloud .tp-label{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--highlight,#d4af37);white-space:nowrap;min-width:62px;}
.tp-read-aloud .tp-play{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--highlight,#d4af37);background:transparent;color:var(--highlight,#d4af37);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.6rem;transition:all .2s;}
.tp-read-aloud .tp-play:hover{background:rgba(212,175,55,.12);box-shadow:0 0 12px rgba(212,175,55,.2);}
.tp-track{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;cursor:pointer;position:relative;min-width:0;}
.tp-track:hover{height:6px;}
.tp-fill{height:100%;border-radius:2px;width:0%;transition:width .1s linear;}
.tp-read-aloud .tp-fill{background:linear-gradient(90deg,var(--highlight,#d4af37),#e8c84a);}
.tp-time{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:#555;min-width:32px;text-align:right;flex-shrink:0;}
.tp-mute{background:none;border:none;color:#555;cursor:pointer;font-size:.7rem;padding:2px;flex-shrink:0;transition:color .2s;}
.tp-mute:hover{color:#e0e0e0;}
.tp-pair{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.tp-half{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;border:1px solid #222;border-radius:.4rem;background:#111;min-width:0;}
.tp-half .tp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tp-half .tp-label{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;min-width:48px;}
.tp-half .tp-play{width:24px;height:24px;border-radius:50%;border:1.5px solid;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.55rem;transition:all .2s;}
.tp-half .tp-play:hover{box-shadow:0 0 10px currentColor;}
.tp-half .tp-track{height:3px;}.tp-half .tp-track:hover{height:5px;}
.tp-half .tp-time{font-size:.55rem;min-width:28px;}
.tp-half.tp-deep .tp-dot{background:#4a9eff;}.tp-half.tp-deep .tp-label{color:#4a9eff;}.tp-half.tp-deep .tp-play{border-color:#4a9eff;color:#4a9eff;}.tp-half.tp-deep .tp-fill{background:#4a9eff;}.tp-half.tp-deep:hover{border-color:rgba(74,158,255,.3);background:rgba(74,158,255,.08);}
.tp-half.tp-debate .tp-dot{background:#a855f7;}.tp-half.tp-debate .tp-label{color:#a855f7;}.tp-half.tp-debate .tp-play{border-color:#a855f7;color:#a855f7;}.tp-half.tp-debate .tp-fill{background:#a855f7;}.tp-half.tp-debate:hover{border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.08);}
.tp-half.tp-critique .tp-dot{background:#22c55e;}.tp-half.tp-critique .tp-label{color:#22c55e;}.tp-half.tp-critique .tp-play{border-color:#22c55e;color:#22c55e;}.tp-half.tp-critique .tp-fill{background:#22c55e;}.tp-half.tp-critique:hover{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08);}
.tp-pair{grid-template-columns:1fr 1fr 1fr;}
.tp-speed{background:#111;border:1px solid #333;color:#888;font-family:'JetBrains Mono',monospace;font-size:.55rem;border-radius:.3rem;padding:.1rem .3rem;cursor:pointer;flex-shrink:0;}
.tp-speed:hover{color:#ccc;border-color:#555;}
.tp-sticky{position:fixed;right:-260px;top:50%;transform:translateY(-50%);width:220px;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border:1px solid #222;border-right:none;border-radius:.6rem 0 0 .6rem;padding:.75rem .8rem;z-index:9999;transition:right .35s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 24px rgba(0,0,0,.6);}
.tp-sticky.tp-visible{right:0;}
.tp-sticky-header{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem;}
.tp-sticky .tp-sticky-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tp-sticky .tp-sticky-label{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-sticky .tp-sticky-close{background:none;border:none;color:#555;cursor:pointer;font-size:.65rem;padding:2px 4px;flex-shrink:0;transition:color .2s;}
.tp-sticky .tp-sticky-close:hover{color:#e0e0e0;}
.tp-sticky-controls{display:flex;align-items:center;gap:.5rem;}
.tp-sticky .tp-play{width:26px;height:26px;border-radius:50%;border:1.5px solid;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.55rem;transition:all .2s;}
.tp-sticky .tp-play:hover{box-shadow:0 0 10px currentColor;}
.tp-sticky .tp-track{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;cursor:pointer;position:relative;}
.tp-sticky .tp-fill{height:100%;border-radius:2px;width:0%;transition:width .1s linear;}
.tp-sticky .tp-time{font-family:'JetBrains Mono',monospace;font-size:.5rem;color:#555;min-width:28px;text-align:right;flex-shrink:0;}
@media(max-width:700px){.tp-pair{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.tp-pair{grid-template-columns:1fr;}.tp-sticky{width:180px;padding:.6rem;}.tp-read-aloud .tp-label{min-width:50px;font-size:.5rem;}.tp-speed{display:none;}}
</style>

function tpUpdateBtns(id,playing){
  document.querySelectorAll('[data-audio="'+id+'"]').forEach(b=>{const i=b.querySelector('i');if(i)i.className='fas fa-'+(playing?'pause':'play');});
  if(id===tpCurrentId||!playing){const si=document.querySelector('#stickyPlayBtn i');if(si)si.className='fas fa-'+(playing?'pause':'play');}
}
function tpSeek(e,id){const a=document.getElementById(id);const r=e.currentTarget.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));if(a.duration)a.currentTime=p*a.duration;}
function tpMute(id,btn){const a=document.getElementById(id);a.muted=!a.muted;btn.querySelector('i').className='fas fa-volume-'+(a.muted?'mute':'up');}
function tpWire(id){
  const a=document.getElementById(id);if(!a)return;
  a.addEventListener('timeupdate',()=>{
    const fill=document.getElementById(id.replace('Audio','Fill'));
    const time=document.getElementById(id.replace('Audio','Time'));
    if(fill&&a.duration)fill.style.width=(a.currentTime/a.duration*100)+'%';
    if(time)time.textContent=tpFmt(a.currentTime);
    if(id===tpCurrentId){const sf=document.getElementById('stickyFill');const st=document.getElementById('stickyTime');if(sf&&a.duration)sf.style.width=(a.currentTime/a.duration*100)+'%';if(st)st.textContent=tpFmt(a.currentTime);}
  });
  a.addEventListener('ended',()=>{tpUpdateBtns(id,false);if(tpCurrentId===id)tpCurrentId=null;});
}
window.tpToggle=tpToggle;window.tpSeek=tpSeek;window.tpMute=tpMute;
window.tpSetSpeed=function(v){
  const rate=parseFloat(v)||1;
  document.querySelectorAll('.tp-player-block audio').forEach(a=>{a.playbackRate=rate;});
};

// Browser TTS fallback
window.tpBrowserTts=function(){
  const main=document.querySelector('[data-tts-source],main,article,#main-content,.content');
  const text=main?main.innerText.replace(/\s+/g,' ').trim().slice(0,12000):'';
  if(!text||!window.speechSynthesis){alert('Browser TTS not available');return;}
  const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
};

// Fetch tracks from worker and bind sources.
// TTS comes from the article-level slug.
// Deep Dive, Podcast, Critique come from the series slug as a shared track,
// falling back to an article-level override if one exists.
function tpBindTracks(){
  const block=document.querySelector('.tp-player-block');
  if(!block)return;
  const lookup=block.dataset.audioLookup;
  const seriesLookup=block.dataset.seriesLookup;
  if(!lookup)return;

  function toMap(tracks){
    const m={};
    tracks.forEach(t=>{
      if(t.mode)m[t.mode]=t.url;
      if(t.is_default)m['__default__']=t.url;
    });
    return m;
  }
  function setSrc(id,url){
    if(!url)return;
    const a=document.getElementById(id);
    if(a){a.src=url;a.preload='metadata';}
  }

  // Fetch article tracks first, then series tracks for shared slots
  const articleP=fetch(lookup).then(r=>r.json()).catch(()=>({tracks:[]}));
  const seriesP=(seriesLookup&&seriesLookup!==lookup)
    ?fetch(seriesLookup).then(r=>r.json()).catch(()=>({tracks:[]}))
    :Promise.resolve({tracks:[]});

  Promise.all([articleP,seriesP]).then(([articleData,seriesData])=>{
    const art=toMap(articleData.tracks||[]);
    const ser=toMap(seriesData.tracks||[]);

    // TTS: article only
    setSrc('tpMainAudio', art['tts']||art['__default__']);
    // Deep Dive, Podcast, Critique: article overrides series, else series shared track
    setSrc('tpDeepAudio',     art['deep']    ||ser['deep']    ||ser['__default__']);
    setSrc('tpDebateAudio',   art['podcast'] ||ser['podcast'] ||ser['__default__']);
    setSrc('tpCritiqueAudio', art['critique']||ser['critique']||ser['__default__']);

    const anyAudio=art['tts']||art['__default__']||ser['__default__'];
    if(!anyAudio){
      const fb=document.getElementById('tpTtsFallback');
      if(fb)fb.style.display='block';
    }
  });
}

tpRegister('tpMainAudio','#d4af37','Read Aloud');
tpRegister('tpDeepAudio','#4a9eff','Deep Dive');
tpRegister('tpDebateAudio','#a855f7','Podcast');
tpRegister('tpCritiqueAudio','#22c55e','Critique');
tpWire('tpMainAudio');tpWire('tpDeepAudio');tpWire('tpDebateAudio');tpWire('tpCritiqueAudio');
tpBindTracks();

// Sticky player
const stickyEl=document.getElementById('stickyPlayer');
if(stickyEl){
  function updateSticky(){
    if(!tpCurrentId||tpStickyDismissed){stickyEl.classList.remove('tp-visible');return;}
    let outOfView=true;
    document.querySelectorAll('.tp-player-block').forEach(b=>{const r=b.getBoundingClientRect();if(r.bottom>0&&r.top<window.innerHeight)outOfView=false;});
    if(outOfView){
      const info=tpColors[tpCurrentId]||{color:'#d4af37',label:'Audio'};
      document.getElementById('stickyDot').style.background=info.color;
      document.getElementById('stickyLabel').style.color=info.color;
      document.getElementById('stickyLabel').textContent=info.label;
      document.getElementById('stickyPlayBtn').style.borderColor=info.color;
      document.getElementById('stickyPlayBtn').style.color=info.color;
      document.getElementById('stickyFill').style.background=info.color;
      stickyEl.classList.add('tp-visible');
    }else{stickyEl.classList.remove('tp-visible');}
  }
  window.tpStickyToggle=function(){if(!tpCurrentId)return;const a=document.getElementById(tpCurrentId);if(a.paused){a.play();tpUpdateBtns(tpCurrentId,true);}else{a.pause();tpUpdateBtns(tpCurrentId,false);}};
  window.tpStickySeek=function(e){if(!tpCurrentId)return;const a=document.getElementById(tpCurrentId);const r=e.currentTarget.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));if(a.duration)a.currentTime=p*a.duration;};
  window.tpCloseSticky=function(){tpStickyDismissed=true;stickyEl.classList.remove('tp-visible');};
  window.addEventListener('scroll',updateSticky,{passive:true});
  setInterval(updateSticky,500);
}
})();
</script>
