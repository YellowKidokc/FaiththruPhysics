<!-- TP PILL PLAYER BAR — inject after <body>; requires /mda/components/tp-pill-player.css and /mda/components/tp-pill-player.js -->
<div class="tp-pill-bar" id="tpPillBar">
  <div class="tp-pill-strip">
    <button class="tp-pill active" data-mode="deep" data-src="PODCAST-URL.m4a" data-label="Deep Dive"><span class="dot"></span>Deep Dive</button>
    <button class="tp-pill" data-mode="debate" data-src="PODCAST-URL.m4a" data-label="Debate"><span class="dot"></span>Debate</button>
    <button class="tp-pill" data-mode="critique" data-src="PODCAST-URL.m4a" data-label="Critique"><span class="dot"></span>Critique</button>
    <button class="tp-pill" data-mode="tts" data-src="PODCAST-URL.m4a" data-label="TTS"><span class="dot"></span>TTS</button>
    <button class="tp-pill" data-mode="web" data-src="PODCAST-URL.m4a" data-label="Web"><span class="dot"></span>Web</button>
  </div>
  <div class="tp-bar-controls">
    <button class="tp-bar-play"><i class="fas fa-play"></i></button>
    <div class="tp-bar-track"><div class="tp-bar-fill"></div></div>
    <span class="tp-bar-time">0:00 / 0:00</span>
    <select class="tp-bar-speed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="1.75">1.75x</option>
      <option value="2">2x</option>
    </select>
  </div>
  <audio preload="metadata"></audio>
</div>
