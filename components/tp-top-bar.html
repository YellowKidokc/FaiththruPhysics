<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Top Bar Demo</title>
  <link rel="stylesheet" href="./tp-theme.css">
  <link rel="stylesheet" href="./tp-top-bar.css">
  <style>
    body { margin: 0; background: #f7f8fb; color: #15171a; font-family: Inter, system-ui, sans-serif; }
    main { max-width: 860px; margin: 40px auto; padding: 0 18px; line-height: 1.65; }
  </style>
</head>
<body>
  <div id="demo-top" data-theme="light"></div>
  <main>
    <section class="tp-reading-panel" data-reading-level="story"><h1>Story Path</h1><p>This is the story-level article body.</p></section>
    <section class="tp-reading-panel" data-reading-level="plain"><h1>Plain Path</h1><p>This is the plain-language article body.</p></section>
    <section class="tp-reading-panel" data-reading-level="test"><h1>Test Path</h1><p>This is the test-oriented article body.</p></section>
    <section class="tp-reading-panel" data-reading-level="proof"><h1>Proof Path</h1><p>This is the proof-oriented article body.</p></section>
  </main>
  <script src="./tp-top-bar.js"></script>
  <script>
    TPTopBar.render(document.getElementById("demo-top"), {
      reading_levels: ["story", "plain", "test", "proof"],
      classification: [
        { tag: "Physics", pct: 40, color: "#378ADD" },
        { tag: "Theology", pct: 30, color: "#D85A30" },
        { tag: "Mathematics", pct: 15, color: "#7F77DD" },
        { tag: "Info theory", pct: 10, color: "#1D9E75" },
        { tag: "Consciousness", pct: 5, color: "#D4537E" }
      ]
    });
  </script>
</body>
</html>
