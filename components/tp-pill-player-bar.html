<!--
  TP Pill-Strip Player Bar (thin horizontal version)
  ==================================================
  Drop this right after the opening <body> tag or just below the site header
  in any MDA article. It loads shared CSS/JS from /mda/components/.

  Per-folder podcast URL: replace PODCAST-URL.m4a with the folder's shared track.
  Example mapping:
    01-story-thread      -> moral-decline-01-introduction.m4a
    02-method-and-metrics-> moral-decline-facts-paper.m4a
    03-evidence-chronology -> moral-decline-01-introduction.m4a (placeholder)
    04-collapse-mechanisms -> moral-decline-02-phase-transition.m4a (placeholder)
    05-amish-and-case-studies -> moral-decline-09-amish-proof.m4a
    06-recovery-and-synthesis -> moral-decline-10-way-back.m4a
    90-appendices-and-source-packets -> moral-decline-of-america.m4a
-->

<link rel="stylesheet" href="/mda/components/tp-pill-player.css">
<script src="/mda/components/tp-pill-player.js" defer></script>

<!-- TP PILL PLAYER BAR -->
<div class="tp-pill-bar" id="tpPillBar">
  <div class="tp-pill-strip">
    <button class="tp-pill active" data-mode="deep" data-src="PODCAST-URL.m4a" data-label="Deep Dive"><span class="dot"></span>Deep Dive</button>
    <button class="tp-pill" data-mode="debate" data-src="PODCAST-URL.m4a" data-label="Debate"><span class="dot"></span>Debate</button>
    <button class="tp-pill" data-mode="critique" data-src="PODCAST-URL.m4a" data-label="Critique"><span class="dot"></span>Critique</button>
    <button class="tp-pill" data-mode="tts" data-src="PODCAST-URL.m4a" data-label="TTS"><span class="dot"></span>TTS</button>
    <button class="tp-pill" data-mode="web" data-src="PODCAST-URL.m4a" data-label="Web"><span class="dot"></span>Web</button>
  </div>
  <div class="tp-bar-controls">
    <button class="tp-bar-play"><i class="fas fa-play"></i></button>
    <div class="tp-bar-track"><div class="tp-bar-fill"></div></div>
    <span class="tp-bar-time">0:00 / 0:00</span>
    <select class="tp-bar-speed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="1.75">1.75x</option>
      <option value="2">2x</option>
    </select>
  </div>
  <audio preload="metadata"></audio>
</div>
