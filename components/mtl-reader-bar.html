<!-- MTL READER MODE BAR — requires /shared/css/mtl-equation.css and /shared/js/mtl-equation.js -->
<div class="mtl-reader-bar" id="mtlReaderBar" aria-label="Math reading level">
  <a href="/equation/" class="mtl-reader-label" title="Open the Master Equation explorer">Math Layer</a>
  <div class="mtl-reader-tabs" role="tablist" aria-label="Reading levels">
    <button class="mtl-reader-tab" type="button" data-reader-mode="easy" aria-selected="false">Story</button>
    <button class="mtl-reader-tab active" type="button" data-reader-mode="standard" aria-selected="true">Plain</button>
    <button class="mtl-reader-tab" type="button" data-reader-mode="academic" aria-selected="false">Deep</button>
    <button class="mtl-reader-tab" type="button" data-reader-mode="proof" aria-selected="false">Proof</button>
  </div>
</div>
