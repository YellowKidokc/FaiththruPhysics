<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=https://media.faiththruphysics.com/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Media Library…</title>
<link rel="canonical" href="https://media.faiththruphysics.com/">
<style>
:root{--bg:#050505;--gold:#d4af37;--text:#e0e0e0;--muted:#666;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
.inner{max-width:400px}
h1{font-family:'Crimson Text',Georgia,serif;font-size:1.8rem;color:var(--gold);margin-bottom:.5rem}
p{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:1.5rem}
a{color:var(--gold);text-decoration:none;font-size:.85rem}
a:hover{text-decoration:underline}
.spinner{width:32px;height:32px;border:2px solid rgba(212,175,55,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1.5rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ TP-HEADING-CLEANUP-v1 ═══ */

/* H1: big, white, serif — page anchor */
.tp-article h1, .ftp-article h1 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 2.8rem;
  font-weight: 400;
  color: #fff;
  margin-bottom: .8rem;
  margin-top: 2rem;
  line-height: 1.1;
  letter-spacing: -.01em;
}

/* H2: GOLD — section markers */
.tp-article h2, .ftp-article h2 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 1.6rem;
  color: #d4af37;
  font-weight: 400;
  margin: 3rem 0 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(212, 175, 55, 0.2);
  letter-spacing: -.01em;
}

/* H3: clean subordinate */
.tp-article h3, .ftp-article h3 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 1.2rem;
  color: #9a9a9a;
  font-weight: 600;
  margin: 2rem 0 .6rem;
}

/* Tables: gold header, dark rows, hover */
.tp-article table, .ftp-article table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: .9rem;
}
.tp-article th, .ftp-article th {
  background: rgba(212, 175, 55, 0.08);
  color: #d4af37;
  font-weight: 600;
  text-align: left;
  padding: .6rem .8rem;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  font-size: .8rem;
  letter-spacing: .03em;
}
.tp-article td, .ftp-article td {
  padding: .5rem .8rem;
  border-bottom: 1px solid #222;
  color: #e5e3df;
}
.tp-article tr:hover td, .ftp-article tr:hover td {
  background: rgba(212, 175, 55, 0.03);
}

/* Lists: proper spacing */
.tp-article ul, .tp-article ol,
.ftp-article ul, .ftp-article ol {
  margin: 1rem 0 1rem 1.5rem;
  line-height: 1.8;
}
.tp-article li, .ftp-article li {
  margin-bottom: .3rem;
}

/* Blockquotes: gold accent */
.tp-article blockquote, .ftp-article blockquote {
  border-left: 3px solid #d4af37;
  margin: 1.5rem 0;
  padding: .8rem 1.2rem;
  background: rgba(212, 175, 55, 0.04);
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-style: italic;
  color: #9a9a9a;
}

/* Drop cap on first paragraph */
.tp-article > p:first-of-type::first-letter,
.ftp-article > p:first-of-type::first-letter,
.tp-level-panel > p:first-of-type::first-letter {
  font-size: 3.2rem;
  float: left;
  color: #d4af37;
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-weight: 600;
  line-height: .8;
  margin: .1rem .4rem 0 0;
  padding-top: .1rem;
}

/* Code/mono blocks */
.tp-article pre, .tp-article code,
.ftp-article pre, .ftp-article code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: .85rem;
}
.tp-article pre, .ftp-article pre {
  background: #0a0a0a;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 1rem 1.2rem;
  overflow-x: auto;
  margin: 1.5rem 0;
}

/* ═══ END TP-HEADING-CLEANUP-v1 ═══ */
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/assets/faith-topbar.css">
<script defer src="/assets/faith-topbar.js"></script>

</head>
<body>
<div class="inner">
  <div class="spinner"></div>
  <h1>Media Library Moved</h1>
  <p class="drop-cap">Images, diagrams, and slide decks now live on the media subdomain.</p>
  <a href="https://media.faiththruphysics.com/">→ media.faiththruphysics.com</a>
</div>
<script src="https://faiththruphysics.com/site-shell/frame.js" defer></script>
</body>
</html>
