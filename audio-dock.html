<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audio Dock — Multi-Source Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
:root {
  --surface: #0f0f0f;
  --surface-light: #1a1a1a;
  --border: #2a2a2a;
  --text-primary: #e0e0e0;
  --text-secondary: #777;
  --highlight: #d4af37;
  --c-deep: #4a9eff;
  --c-read: #d4af37;
  --c-debate: #a855f7;
  --c-critique: #2dd4bf;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--surface); color: var(--text-primary); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }

/* ═══════════════ AUDIO DOCK ═══════════════ */
.audio-dock {
  width: 100%;
  max-width: 480px;
  background: var(--surface-light);
  border: 1px solid var(--border);
  border-radius: .625rem;
  overflow: hidden;
  transition: border-color .3s ease;
}
.audio-dock:hover { border-color: rgba(212,175,55,.25); }

/* ── PILL ROW ── */
.dock-pills {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
}
.dock-pill {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  padding: .6rem .5rem;
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-secondary);
  transition: all .25s ease;
  position: relative;
}
.dock-pill::after {
  content: '';
  position: absolute;
  bottom: 0; left: 15%; right: 15%;
  height: 2px; border-radius: 1px;
  background: transparent;
  transition: all .25s ease;
}
.dock-pill:hover { color: var(--text-primary); background: rgba(255,255,255,.03); }
.dock-pill[data-src="deep"]    { --pill-c: var(--c-deep); }
.dock-pill[data-src="read"]    { --pill-c: var(--c-read); }
.dock-pill[data-src="debate"]  { --pill-c: var(--c-debate); }
.dock-pill[data-src="critique"]{ --pill-c: var(--c-critique); }
.dock-pill.active { color: var(--pill-c); background: rgba(255,255,255,.02); }
.dock-pill.active::after { background: var(--pill-c); box-shadow: 0 0 8px color-mix(in srgb, var(--pill-c) 40%, transparent); }
.dock-pill .pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .5; transition: opacity .25s; }
.dock-pill.active .pill-dot { opacity: 1; }
.dock-pill.unavailable { opacity: .3; cursor: default; pointer-events: none; }

/* ── PLAYER BODY ── */
.dock-body { display: flex; align-items: center; gap: .65rem; padding: .65rem .85rem; }
.dock-play {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--highlight); background: transparent;
  color: var(--highlight); font-size: .7rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .2s ease;
}
.dock-play:hover { background: rgba(212,175,55,.1); transform: scale(1.05); }
.dock-play.playing { animation: pulse-ring 2s ease-in-out infinite; }
@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,.2); }
  50% { box-shadow: 0 0 0 4px rgba(212,175,55,.05); }
}
.dock-track-wrap { flex: 1; display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.dock-track { width: 100%; height: 4px; background: #222; border-radius: 2px; cursor: pointer; overflow: hidden; position: relative; }
.dock-fill { height: 100%; width: 0%; border-radius: 2px; background: var(--highlight); transition: width .15s linear, background .3s; }
.dock-times { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: .5rem; color: var(--text-secondary); }
.dock-vol { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: .75rem; flex-shrink: 0; padding: 2px; transition: color .2s; }
.dock-vol:hover { color: var(--text-primary); }
.dock-empty { display: none; align-items: center; justify-content: center; padding: .85rem; font-family: 'JetBrains Mono', monospace; font-size: .55rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); opacity: .5; font-style: italic; }
.dock-body.hidden { display: none; }
.dock-empty.visible { display: flex; }

/* ═══ TP-HEADING-CLEANUP-v1 ═══ */

/* H1: big, white, serif — page anchor */
.tp-article h1, .ftp-article h1 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 2.8rem;
  font-weight: 400;
  color: #fff;
  margin-bottom: .8rem;
  margin-top: 2rem;
  line-height: 1.1;
  letter-spacing: -.01em;
}

/* H2: GOLD — section markers */
.tp-article h2, .ftp-article h2 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 1.6rem;
  color: #d4af37;
  font-weight: 400;
  margin: 3rem 0 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(212, 175, 55, 0.2);
  letter-spacing: -.01em;
}

/* H3: clean subordinate */
.tp-article h3, .ftp-article h3 {
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-size: 1.2rem;
  color: #9a9a9a;
  font-weight: 600;
  margin: 2rem 0 .6rem;
}

/* Tables: gold header, dark rows, hover */
.tp-article table, .ftp-article table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: .9rem;
}
.tp-article th, .ftp-article th {
  background: rgba(212, 175, 55, 0.08);
  color: #d4af37;
  font-weight: 600;
  text-align: left;
  padding: .6rem .8rem;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  font-size: .8rem;
  letter-spacing: .03em;
}
.tp-article td, .ftp-article td {
  padding: .5rem .8rem;
  border-bottom: 1px solid #222;
  color: #e5e3df;
}
.tp-article tr:hover td, .ftp-article tr:hover td {
  background: rgba(212, 175, 55, 0.03);
}

/* Lists: proper spacing */
.tp-article ul, .tp-article ol,
.ftp-article ul, .ftp-article ol {
  margin: 1rem 0 1rem 1.5rem;
  line-height: 1.8;
}
.tp-article li, .ftp-article li {
  margin-bottom: .3rem;
}

/* Blockquotes: gold accent */
.tp-article blockquote, .ftp-article blockquote {
  border-left: 3px solid #d4af37;
  margin: 1.5rem 0;
  padding: .8rem 1.2rem;
  background: rgba(212, 175, 55, 0.04);
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-style: italic;
  color: #9a9a9a;
}

/* Drop cap on first paragraph */
.tp-article > p:first-of-type::first-letter,
.ftp-article > p:first-of-type::first-letter,
.tp-level-panel > p:first-of-type::first-letter {
  font-size: 3.2rem;
  float: left;
  color: #d4af37;
  font-family: var(--serif, 'Crimson Text', Georgia, serif);
  font-weight: 600;
  line-height: .8;
  margin: .1rem .4rem 0 0;
  padding-top: .1rem;
}

/* Code/mono blocks */
.tp-article pre, .tp-article code,
.ftp-article pre, .ftp-article code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: .85rem;
}
.tp-article pre, .ftp-article pre {
  background: #0a0a0a;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 1rem 1.2rem;
  overflow-x: auto;
  margin: 1.5rem 0;
}

/* ═══ END TP-HEADING-CLEANUP-v1 ═══ */
</style>
<link rel="stylesheet" href="/assets/faith-topbar.css">
<script defer src="/assets/faith-topbar.js"></script>

</head>
<body>

<!--
  ╔═══════════════════════════════════════════════════════╗
  ║  AUDIO DOCK — DROP-IN COMPONENT                      ║
  ║                                                       ║
  ║  Usage:                                               ║
  ║  1. Set data-src on each pill (deep/read/debate/etc)  ║
  ║  2. Set data-url to the Cloudflare R2 MP3 URL         ║
  ║  3. If no audio yet, omit data-url = pill dims out    ║
  ║  4. Works with any number of pills (2-5)              ║
  ║  5. Fully self-contained — no external JS needed      ║
  ║  6. Serves from R2: r2.faiththruphysics.com           ║
  ╚═══════════════════════════════════════════════════════╝
-->

<div class="audio-dock" id="audioDock">
  <div class="dock-pills">
    <button class="dock-pill active" data-src="deep"
            data-url="https://r2.faiththruphysics.com/GTQ-02/audio/deep-dive.mp3">
      <span class="pill-dot"></span>Deep Dive
    </button>
    <button class="dock-pill" data-src="read"
            data-url="https://r2.faiththruphysics.com/GTQ-02/audio/read-aloud.mp3">
      <span class="pill-dot"></span>Read Aloud
    </button>
    <button class="dock-pill" data-src="debate"
            data-url="https://r2.faiththruphysics.com/GTQ-02/audio/debate.mp3">
      <span class="pill-dot"></span>Debate
    </button>
    <button class="dock-pill" data-src="critique">
      <span class="pill-dot"></span>Critique
    </button>
  </div>

  <div class="dock-body" id="dockBody">
    <button class="dock-play" id="dockPlay" onclick="dockToggle()">
      <i class="fas fa-play" id="dockPlayIcon"></i>
    </button>
    <div class="dock-track-wrap">
      <div class="dock-track" id="dockTrack" onclick="dockSeek(event)">
        <div class="dock-fill" id="dockFill"></div>
      </div>
      <div class="dock-times">
        <span id="dockCurrent">0:00</span>
        <span id="dockDuration">0:00</span>
      </div>
    </div>
    <button class="dock-vol" id="dockVol" onclick="dockMute()">
      <i class="fas fa-volume-up"></i>
    </button>
  </div>

  <div class="dock-empty" id="dockEmpty">
    <i class="fas fa-clock" style="margin-right:.5rem;"></i> Coming soon
  </div>
</div>

<script>
(function(){
  const dock   = document.getElementById('audioDock');
  const body   = document.getElementById('dockBody');
  const empty  = document.getElementById('dockEmpty');
  const playBtn= document.getElementById('dockPlay');
  const icon   = document.getElementById('dockPlayIcon');
  const fill   = document.getElementById('dockFill');
  const curEl  = document.getElementById('dockCurrent');
  const durEl  = document.getElementById('dockDuration');
  const volBtn = document.getElementById('dockVol');
  const track  = document.getElementById('dockTrack');
  const pills  = dock.querySelectorAll('.dock-pill');

  let audio = new Audio();
  audio.preload = 'metadata';
  let activeKey = null;
  let muted = false;

  const colors = {
    deep:     getComputedStyle(document.documentElement).getPropertyValue('--c-deep').trim(),
    read:     getComputedStyle(document.documentElement).getPropertyValue('--c-read').trim(),
    debate:   getComputedStyle(document.documentElement).getPropertyValue('--c-debate').trim(),
    critique: getComputedStyle(document.documentElement).getPropertyValue('--c-critique').trim()
  };

  function fmt(s){
    if(!s||isNaN(s)) return '0:00';
    const m=Math.floor(s/60), sec=Math.floor(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }

  pills.forEach(p=>{ if(!p.dataset.url) p.classList.add('unavailable'); });

  pills.forEach(p=>{
    p.addEventListener('click', ()=>{
      const key = p.dataset.src;
      const url = p.dataset.url;
      if(!url) return;
      if(key === activeKey){ if(audio.paused) audio.play(); else audio.pause(); return; }
      audio.pause();
      audio.src = url;
      activeKey = key;
      pills.forEach(q=> q.classList.remove('active'));
      p.classList.add('active');
      const c = colors[key] || colors.read;
      fill.style.background = c;
      playBtn.style.setProperty('--active-c', c);
      playBtn.style.borderColor = c;
      playBtn.style.color = c;
      body.classList.remove('hidden');
      empty.classList.remove('visible');
      audio.play();
    });
  });

  const firstAvail = dock.querySelector('.dock-pill[data-url]');
  if(firstAvail){
    const key = firstAvail.dataset.src;
    audio.src = firstAvail.dataset.url;
    activeKey = key;
    const c = colors[key] || colors.read;
    fill.style.background = c;
    playBtn.style.borderColor = c;
    playBtn.style.color = c;
  } else {
    body.classList.add('hidden');
    empty.classList.add('visible');
  }

  window.dockToggle = function(){
    if(!audio.src) return;
    if(audio.paused) audio.play(); else audio.pause();
  };
  audio.addEventListener('play', ()=>{ icon.className='fas fa-pause'; playBtn.classList.add('playing'); });
  audio.addEventListener('pause', ()=>{ icon.className='fas fa-play'; playBtn.classList.remove('playing'); });
  audio.addEventListener('ended', ()=>{ icon.className='fas fa-play'; playBtn.classList.remove('playing'); fill.style.width='0%'; curEl.textContent='0:00'; });
  audio.addEventListener('timeupdate', ()=>{ if(!audio.duration) return; fill.style.width=(audio.currentTime/audio.duration*100)+'%'; curEl.textContent=fmt(audio.currentTime); });
  audio.addEventListener('loadedmetadata', ()=>{ durEl.textContent=fmt(audio.duration); });

  window.dockSeek = function(e){
    if(!audio.duration) return;
    const r=track.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    audio.currentTime=p*audio.duration;
  };
  window.dockMute = function(){
    muted=!muted; audio.muted=muted;
    volBtn.innerHTML=muted?'<i class="fas fa-volume-mute"></i>':'<i class="fas fa-volume-up"></i>';
  };
})();
</script>
<script src="https://faiththruphysics.com/site-shell/frame.js" defer></script>
</body>
</html>
